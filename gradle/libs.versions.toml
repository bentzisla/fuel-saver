[versions]
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"

coreKtx = "1.17.0"
activityCompose = "1.11.0"
composeBom = "2025.09.01"
materialIconsCore = "1.7.8"
lifecycle = "2.9.4"
navigation = "2.9.8"

hilt = "2.57.2"
hiltNavigation = "1.2.0"
room = "2.7.2"
datastore = "1.1.7"

okhttp = "4.12.0"
retrofit = "2.11.0"
